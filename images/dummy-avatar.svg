<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGrad)" />
  
  <!-- Clip Path to keep human body within the avatar circle -->
  <clipPath id="circleClip">
    <circle cx="64" cy="64" r="64" />
  </clipPath>
  
  <g clip-path="url(#circleClip)">
    <!-- Head -->
    <circle cx="64" cy="46" r="23" fill="url(#avatarGrad)" />
    <!-- Shoulders & Torso -->
    <path d="M 22 118 C 22 88, 42 76, 64 76 C 86 76, 106 88, 106 118 Z" fill="url(#avatarGrad)" />
  </g>
</svg>

